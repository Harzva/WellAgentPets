<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Animated pink Claude girl twirling dress</title><desc id="desc">A tiny pink Claude girl pet with braids, a bow hat, and a twirling skirt.</desc>
  <style>.pet{animation:twirl 1s steps(3) infinite;transform-origin:64px 94px}.skirt{animation:sk 1s steps(2) infinite;transform-origin:64px 92px}.braid{animation:br 1s steps(2) infinite;transform-origin:64px 52px}@keyframes twirl{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes sk{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.16)}}@keyframes br{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}</style>
  <g class="pet"><g class="braid"><rect x="25" y="51" width="10" height="36" rx="3" fill="#8b4b5d" stroke="#5f2d3d" stroke-width="3"/><rect x="93" y="51" width="10" height="36" rx="3" fill="#8b4b5d" stroke="#5f2d3d" stroke-width="3"/><rect x="24" y="82" width="12" height="8" fill="#ff6fa8"/><rect x="92" y="82" width="12" height="8" fill="#ff6fa8"/></g><rect x="37" y="23" width="12" height="29" rx="3" fill="#f7a1bd" stroke="#a94f72" stroke-width="4"/><rect x="79" y="23" width="12" height="29" rx="3" fill="#f7a1bd" stroke="#a94f72" stroke-width="4"/><path d="M42 30h13v-8h11v8h15v15H66v8H55v-8H42V30Z" fill="#ff6fa8" stroke="#9d315d" stroke-width="4"/><rect x="33" y="45" width="62" height="47" rx="4" fill="#f59ab9" stroke="#9f4d6d" stroke-width="4"/><rect x="44" y="62" width="9" height="18" rx="2" fill="#242124"/><rect x="76" y="62" width="9" height="18" rx="2" fill="#242124"/><rect x="56" y="84" width="16" height="4" fill="#8a3b58"/><path class="skirt" d="M28 88h72l-13 20H41L28 88Z" fill="#ffcae0" stroke="#9f4d6d" stroke-width="4"/><rect x="47" y="105" width="7" height="10" fill="#e978a0"/><rect x="75" y="105" width="7" height="10" fill="#e978a0"/></g>
</svg>
