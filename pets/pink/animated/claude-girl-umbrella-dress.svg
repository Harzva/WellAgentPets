<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Animated pink Claude girl umbrella dress</title><desc id="desc">A tiny pink Claude girl pet with braids, a skirt, a small hat, and moving raindrops.</desc>
  <style>.rain{animation:r 1s steps(4) infinite}.r2{animation-delay:.25s}.umbrella{animation:u 1s steps(3) infinite;transform-origin:98px 54px}@keyframes r{0%{transform:translateY(-8px);opacity:0}25%,75%{opacity:1}100%{transform:translateY(18px);opacity:0}}@keyframes u{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}</style>
