<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Animated bouncing Claude pet</title>
  <desc id="desc">A tiny orange square pet bouncing gently.</desc>
  <style>
    .pet { animation: bounce 1.2s steps(4) infinite; transform-origin: 64px 86px; }
    .shadow { animation: shadow 1.2s steps(4) infinite; transform-origin: 64px 116px; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes shadow { 0%,100%{transform:scaleX(1);opacity:.32} 50%{transform:scaleX(.68);opacity:.16} }
  </style>
  <rect class="shadow" x="34" y="113" width="60" height="8" rx="4" fill="#8b5a3b"/>
  <g class="pet">
    <rect x="37" y="21" width="12" height="31" rx="3" fill="#f6a066" stroke="#a96b45" stroke-width="4"/>
    <rect x="79" y="21" width="12" height="31" rx="3" fill="#f6a066" stroke="#a96b45" stroke-width="4"/>
    <rect x="33" y="44" width="62" height="54" rx="4" fill="#f49a5e" stroke="#9d603f" stroke-width="4"/>
    <rect x="45" y="33" width="38" height="16" fill="#f49a5e"/>
    <rect x="20" y="57" width="17" height="22" rx="4" fill="#f6a066" stroke="#a96b45" stroke-width="4"/>
    <rect x="91" y="57" width="17" height="22" rx="4" fill="#f6a066" stroke="#a96b45" stroke-width="4"/>
    <rect x="43" y="61" width="9" height="21" rx="2" fill="#232323"/>
    <rect x="76" y="61" width="9" height="21" rx="2" fill="#232323"/>
    <rect x="47" y="96" width="7" height="16" fill="#e9844f"/>
    <rect x="61" y="96" width="7" height="16" fill="#e9844f"/>
    <rect x="74" y="96" width="7" height="16" fill="#e9844f"/>
  </g>
</svg>
